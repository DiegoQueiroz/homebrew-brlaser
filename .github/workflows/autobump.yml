name: Bump brlaser cask on schedule or request

on:
  workflow_dispatch:
    inputs:
      casks:
        description: Custom list of casks to livecheck and bump if outdated
        required: false
  schedule:
    - cron: "23 6 * * *"

concurrency:
  group: autobump-${{ inputs.casks && github.run_id || 'scheduled' }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  autobump:
    env:
      HOMEBREW_DEVELOPER: 1
    runs-on: macos-26
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Configure Git user
        uses: Homebrew/actions/git-user-config@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          username: ${{ (github.event_name == 'workflow_dispatch' && github.actor) || 'DiegoQueiroz' }}

      - name: Bump brlaser cask
        id: autobump
        env:
          HOMEBREW_TEST_BOT_AUTOBUMP: 1
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: DiegoQueiroz
          HOMEBREW_GIT_COMMITTER_EMAIL: queiroz.diego@gmail.com
          CASKS: ${{ inputs.casks }}
        continue-on-error: true
        run: |
          BREW_BUMP=(brew bump --no-fork --open-pr --casks)
          if [[ -n "${CASKS-}" ]]; then
            xargs "${BREW_BUMP[@]}" <<<"${CASKS}"
          else
            xargs "${BREW_BUMP[@]}" --tap=DiegoQueiroz/brlaser < .github/autobump.txt
          fi

      - name: Run CI on bump PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A pull request opened with GITHUB_TOKEN does not trigger the
          # pull_request event, so ci.yml would never run on its own here and
          # required checks would wait forever. workflow_dispatch is one of the
          # events GITHUB_TOKEN may still raise, so ask for the run directly.
          for branch in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --author "app/github-actions" --json headRefName -q '.[].headRefName'); do
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" || true
          done

      - name: Enable auto-merge on bump PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --author "app/github-actions" --json number -q '.[].number'); do
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash || true
          done
